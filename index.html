<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KC MOVIES</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #08090d;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #101116;
  padding: 20px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  border-bottom: 1px solid #25232c;
}

.logo {
  font-size: 26px;
  font-weight: bold;
  color: #e50914;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 10px;
}

.hero {
  padding: 70px 6%;
  background: linear-gradient(90deg,#08090d,#19151e);
}

.hero h1 {
  font-size: 45px;
  margin: 0;
}

.hero p {
  color: #aaa;
  font-size: 18px;
}

.search {
  margin-top: 25px;
  max-width: 500px;
  display: flex;
  gap: 10px;
}

.search input {
  width: 100%;
  padding: 15px;
  background: #202027;
  border: 1px solid #333;
  border-radius: 8px;
  color: white;
  font-size: 16px;
}

main {
  padding: 30px 5%;
}

.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.filters button {
  background: #222229;
  color: white;
  border: 0;
  padding: 11px 18px;
  border-radius: 25px;
  cursor: pointer;
}

.filters button.active,
.filters button:hover {
  background: #e50914;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(160px,1fr));
  gap: 20px;
}

.movie {
  background: #17171d;
  border-radius: 12px;
  overflow: hidden;
  transition: .25s;
}

.movie:hover {
  transform: translateY(-5px);
}

.poster {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  background: #292932;
}

.movie-info {
  padding: 13px;
}

.movie h3 {
  margin: 5px 0 10px;
  font-size: 17px;
}

.meta {
  color: #aaa;
  font-size: 13px;
}

.rating {
  color: #ffd166;
  margin-top: 8px;
}

.movie button {
  width: 100%;
  margin-top: 12px;
  background: #e50914;
  border: 0;
  color: white;
  padding: 10px;
  border-radius: 6px;
  cursor: pointer;
}

.movie button:hover {
  background: #b80710;
}

footer {
  text-align: center;
  padding: 35px;
  color: #777;
  border-top: 1px solid #222;
  margin-top: 40px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #000b;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

.modal-content {
  background: #181820;
  padding: 25px;
  border-radius: 15px;
  max-width: 500px;
  width: 100%;
}

.modal-content img {
  width: 120px;
  border-radius: 8px;
  float: left;
  margin-right: 20px;
}

.modal-content p {
  color: #bbb;
  line-height: 1.6;
}

.modal-content a,
.close {
  display: inline-block;
  background: #e50914;
  color: white;
  padding: 10px 15px;
  border-radius: 7px;
  text-decoration: none;
  border: 0;
  cursor: pointer;
  margin-top: 10px;
}

@media(max-width:600px) {
  .hero h1 {
    font-size: 32px;
  }

  .grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 12px;
  }

  header {
    justify-content: center;
  }

  nav a {
    margin: 0 5px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🎬 KC MOVIES</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#movies">Movies</a>
    <a href="#footer">About</a>
  </nav>
</header>

<section class="hero" id="home">
  <h1>Welcome to KC MOVIES</h1>
  <p>Discover your favorite movies, anime and series.</p>

  <div class="search">
    <input id="searchInput"
      placeholder="🔎 Search movies..."
      oninput="renderMovies()">
  </div>
</section>

<main id="movies">
  <h2>🔥 Popular Movies</h2>

  <div class="filters">
    <button class="active" onclick="filterType('All',this)">All</button>
    <button onclick="filterType('Movie',this)">Movies</button>
    <button onclick="filterType('Anime',this)">Anime</button>
    <button onclick="filterType('Series',this)">Series</button>
  </div>

  <div class="grid" id="movieGrid"></div>
</main>

<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-content" id="modalContent"></div>
</div>

<footer id="footer">
  <h3>KC MOVIES</h3>
  <p>Made with ❤️ by KC</p>
  <p>© 2026 KC MOVIES</p>
</footer>

<script>
const movies = [
{
 title:"Inception",
 year:2010,
 type:"Movie",
 rating:"8.8",
 poster:"https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg",
 description:"A skilled thief enters dreams to steal secrets and faces an impossible mission.",
 trailer:"https://www.youtube.com/results?search_query=Inception+official+trailer"
},
{
 title:"Interstellar",
 year:2014,
 type:"Movie",
 rating:"8.7",
 poster:"https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxeW5iEv.jpg",
 description:"Explorers travel beyond this galaxy to find a future for humanity.",
 trailer:"https://www.youtube.com/results?search_query=Interstellar+official+trailer"
},
{
 title:"Spider-Man: Across the Spider-Verse",
 year:2023,
 type:"Movie",
 rating:"8.6",
 poster:"https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg",
 description:"Miles Morales travels across the multiverse and meets other Spider heroes.",
 trailer:"https://www.youtube.com/results?search_query=Spider+Verse+official+trailer"
},
{
 title:"Dune: Part Two",
 year:2024,
 type:"Movie",
 rating:"8.5",
 poster:"https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJeMFFxDkcme0Tv1.jpg",
 description:"Paul Atreides joins the Fremen and faces his destiny on Arrakis.",
 trailer:"https://www.youtube.com/results?search_query=Dune+Part+Two+official+trailer"
},
{
 title:"Demon Slayer",
 year:2019,
 type:"Anime",
 rating:"8.6",
 poster:"https://image.tmdb.org/t/p/w500/xUfRZu2mi8jH6Sz9wA8l3pY0V0.jpg",
 description:"Tanjiro begins a journey to protect his sister and fight demons.",
 trailer:"https://www.youtube.com/results?search_query=Demon+Slayer+official+trailer"
},
{
 title:"Attack on Titan",
 year:2013,
 type:"Anime",
 rating:"9.1",
 poster:"https://image.tmdb.org/t/p/w500/hTP1DtLGFamjfu8WqjnuQdP1n4i.jpg",
 description:"Humanity fights for survival against mysterious giant creatures.",
 trailer:"https://www.youtube.com/results?search_query=Attack+on+Titan+official+trailer"
},
{
 title:"Solo Leveling",
 year:2024,
 type:"Anime",
 rating:"8.5",
 poster:"https://image.tmdb.org/t/p/w500/geCRueV3ElhRTr0xtJuEWJt6dJ1.jpg",
 description:"A hunter gains a unique ability to grow stronger through quests.",
 trailer:"https://www.youtube.com/results?search_query=Solo+Leveling+official+trailer"
},
{
 title:"Breaking Bad",
 year:2008,
 type:"Series",
 rating:"9.5",
 poster:"https://image.tmdb.org/t/p/w500/ztkUQFLlC19CCMYHWg1cs7Y8o7Q.jpg",
 description:"A chemistry teacher enters a dangerous criminal world.",
 trailer:"https://www.youtube.com/results?search_query=Breaking+Bad+official+trailer"
},    
{
  <div style="width:100%;aspect-ratio:16/9;">
  <iframe
    src="https://vioo.cc/embed/6JjGw"
    style="width:100%;height:100%;border:0;"
    allowfullscreen>
  </iframe>
</div>
  
let currentType = "All";
function renderMovies() {
 const grid = document.getElementById("movieGrid");
 const query = document.getElementById("searchInput").value.toLowerCase();

 const filtered = movies.filter(m =>
   (currentType === "All" || m.type === currentType) &&
   m.title.toLowerCase().includes(query)
 );

 grid.innerHTML = "";

 if(filtered.length === 0) {
   grid.innerHTML = "<p>No movies found.</p>";
   return;
 }

 filtered.forEach(m => {
   grid.innerHTML += `
    <div class="movie">
      <img class="poster"
        src="${m.poster}"
        alt="${m.title}"
        loading="lazy"
        onerror="this.style.display='none'">
      <div class="movie-info">
        <h3>${m.title}</h3>
        <div class="meta">${m.type} • ${m.year}</div>
        <div class="rating">⭐ ${m.rating}</div>
        <button onclick="showInfo('${m.title}')">More Info</button>
      </div>
    </div>
   `;
 });
}

function filterType(type,button) {
 currentType = type;
 document.querySelectorAll(".filters button").forEach(b =>
   b.classList.remove("active")
 );
 button.classList.add("active");
 renderMovies();
}

function showInfo(title) {
 const m = movies.find(x => x.title === title);
 document.getElementById("modalContent").innerHTML = `
   <img src="${m.poster}" alt="${m.title}">
   <h2>${m.title}</h2>
   <p>${m.type} • ${m.year} • ⭐ ${m.rating}</p>
   <p>${m.description}</p>
   <a href="${m.trailer}" target="_blank">▶ Watch Trailer</a>
   <button class="close" onclick="document.getElementById('modal').style.display='none'">Close</button>
 `;
 document.getElementById("modal").style.display="flex";
}

function closeModal(event) {
 if(event.target.id === "modal") {
   document.getElementById("modal").style.display="none";
 }
}

renderMovies();
</script>

</body>
</html>
